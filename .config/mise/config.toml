[tools]
node = "latest"
# bun = "latest"
# python = "latest"
# go = "latest"
# rust = "latest"
"npm:@antfu/ni" = "latest"
"npm:taze" = "latest"
"npm:actions-up" = "latest"
"npm:bumpp" = "latest"

[tasks.upgrade]
description = "Upgrade tools"
run = """
brew upgrade
mise upgrade
"""

[tasks.clean]
description = "Cleanup cache"
run = """
npm cache clean --force
pnpm store prune 2>/dev/null || echo "  pnpm not installed, skipping"
corepack cache clean 2>/dev/null || echo "  corepack not installed, skipping"
brew cleanup
"""
